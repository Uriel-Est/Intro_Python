project:
  type: website
  output-dir: docs
  render:
    - index.qmd   # só a homepage por enquanto

website:
  title: "Introdução aos Softwares Estatísticos"   # <<< string, não boolean
  navbar:
    title: false            # esconde o texto do título na barra (fica só teu header estilizado)
    collapse-below: lg
    left:
      - text: "Início"
        href: index.qmd
  # (sem bloco 'sidebar' -> nenhuma sidebar de projeto)

format:
  html:
    theme: default
    css: [styles.css, toc-fix.css]  # seu CSS + o fix do TOC
    toc: true
    toc-title: "Nesta página"
    anchor-sections: true
    link-external-newwindow: true
lang: pt-BR
