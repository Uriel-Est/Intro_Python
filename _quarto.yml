project:
  type: website

format:
  html:
    theme: default
    css: styles.css   # seu CSS customizado

website:
  title: "Introdução aos Softwares Estatísticos"

  # ============================
  # 1) BARRA DE NAVEGAÇÃO (HEADER)
  # ============================
  navbar:
    # Injetamos o “brand” com HTML puro
    brand: |
      <div class="custom-header">
        <div class="logos-left">
          <img src="LOGO-PNG³.png"       alt="Leap logo"            class="logo-left-top">
          <img src="logo-dept.png"       alt="Depto. Estatística"   class="logo-left-bottom">
        </div>
        <div class="header-title">Introdução aos Softwares Estatísticos</div>
        <div class="logo-right">
          <img src="logo-uf.png"         alt="UF logo"               class="logo-uf">
        </div>
      </div>

    # Se quiser um link “Início” à esquerda, mantenha assim:
    left:
      - text: "Início"
        href: introducao-software-estatistico.qmd

  # ============================
  # 2) SIDEBAR (ÍNDICE DO SITE)
  # ============================
  sidebar:
    - id: introducao-software-estatistico
      title: "Índice"
      style: docked         # fica fixo à esquerda
      background: light     # fundo claro
      contents:
        - section: "Quarto"
          contents:
            - introducao-software-estatistico.qmd
        - section: "Git e GitHub"
          contents:
            - text: "O que são"
              href: introducao-software-estatistico.qmd#o-que-sao
            - text: "Para que servem"
              href: introducao-software-estatistico.qmd#para-que-servem
            - text: "Comandos básicos"
              href: introducao-software-estatistico.qmd#comandos-basicos
        - section: "pip"
          contents:
            - text: "O que é"
              href: introducao-software-estatistico.qmd#o-que-e
            - text: "Como instalar pacotes"
              href: introducao-software-estatistico.qmd#como-instalar-pacotes
            - text: "Bibliotecas populares"
              href: introducao-software-estatistico.qmd#bibliotecas-populares
        - section: "Conceitos de Python"
          contents:
            - text: "Tipos de dados"
              href: introducao-software-estatistico.qmd#tipos-de-dados
            - text: "Variáveis e operadores"
              href: introducao-software-estatistico.qmd#variaveis-e-operadores
